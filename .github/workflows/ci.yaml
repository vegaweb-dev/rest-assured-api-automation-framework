name: Maven CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run tests
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        id: maven_tests
        run: mvn clean test

      - name: Load test report history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: previous-report

      - name: Install Allure CLI
        if: always()
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.25.0/allure-2.25.0.tgz
          tar -zxvf allure-2.25.0.tgz
          sudo mv allure-2.25.0 /opt/allure
          sudo ln -sf /opt/allure/bin/allure /usr/local/bin/allure

      - name: Verify Allure Installation
        run: allure --version
        if: always()

      - name: Generate Allure Report
        if: always()
        run: |
          if [ -d "previous-report/history" ]; then
            cp -r previous-report/history target/allure-results/
          fi
          allure generate target/allure-results --clean -o final-report

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: final-report

      - name: Enforce Quality Gate
        if: always() && steps.maven_tests.outcome == 'failure'
        run: |
          echo "::error::Quality Gate violation! The pipeline has been stopped because the 'Run tests' stage failed."
          exit 1
  
